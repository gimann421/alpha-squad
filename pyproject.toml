[project]
name = "alpha-squad"
version = "0.1.0"
description = "Fantasy football market-inefficiency intelligence system"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pandas>=2.2",
  "polars>=1.9",
  "duckdb>=1.1",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "catboost>=1.2",
  "xgboost>=2.1",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "rich>=13.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "hypothesis>=6.112",
]

[project.scripts]
alpha-squad = "alpha_squad.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_squad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: fast isolated unit tests",
  "integration: cross-module tests against local fixtures/DuckDB",
  "leakage: temporal leakage and as-of integrity tests",
  "contract: agent/data contract schema tests",
  "e2e: end-to-end pipeline tests",
  "network: tests that hit real external data sources (deselected by default)",
]
addopts = "-m 'not network' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# B008 (function call in argument default) is FastAPI's own idiomatic dependency-injection
# pattern (Depends(...)/Query(...) in a route signature's defaults) -- not the mutable-default
# bug the rule exists to catch. FastAPI inspects these at route-declaration time, not per-call.
[tool.ruff.lint.per-file-ignores]
"src/alpha_squad/api/**/*.py" = ["B008"]

[tool.coverage.run]
source = ["src/alpha_squad"]
