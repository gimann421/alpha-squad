name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      # Network-marked tests hit real external sources and are deselected by default
      # (see docs/DATA_SOURCES.md for which sources are reachable) -- `make test` runs the
      # offline unit/leakage/contract suite only.
      - name: Test
        run: make test
